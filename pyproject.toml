[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibioai-toolserver"
version = "0.1.2"
description = "Standalone HTTP ToolServer for OmniBioAI (REST-backed bioinformatics tools like Enrichr)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Manish Kumar" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "httpx>=0.27",
  "pydantic>=2",
  # HIPAA-V2-019: delegated-execution authentication (toolserver/security.py)
  # requires omnibioai-iam-client's iam_client.delegated API
  # (require_delegated_execution / DelegatedExecutionIdentity), which pulls in
  # redis + python-jose[cryptography] transitively (see that package's own
  # pyproject.toml).
  #
  # v0.1.5 adds iam_client.registration (require_toolserver_registration),
  # used by toolserver/security.py::require_tes_registration for the
  # service-only TES -> POST /register_tools credential. Private repo:
  # Docker builds pass a GitHub token as a BuildKit secret (see Dockerfile).
  "omnibioai-iam-client @ git+https://github.com/OmniBioAI/omnibioai-iam-client.git@v0.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.setuptools]
packages = ["toolserver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-q",
  "--cov=toolserver",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]

[tool.coverage.run]
branch = true
source = ["toolserver"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]